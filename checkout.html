<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — ShopEasy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">🛒</div>
      <a href="index.html" class="site-name">ShopEasy</a>
    </div>
    <nav class="header-nav">
      <a href="cart.html" class="nav-link">← Back to Cart</a>
    </nav>
    <a href="cart.html" class="cart-icon" style="text-decoration:none;">
      🛒
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </header>

  <!-- PAYMENT ERROR BANNER -->
  <div class="payment-error-banner" id="payment-error" style="display:none;"></div>

  <!-- MAIN -->
  <main class="main checkout-main">

    <!-- LEFT: Checkout Form -->
    <section class="checkout-form-section">
      <h2 class="section-title">Shipping Details</h2>
      <form id="checkout-form" class="checkout-form" onsubmit="handlePayNow(event)">

        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" placeholder="Jane Doe" required />
        </div>

        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" name="address" rows="3" placeholder="123 Main Street, City, State, ZIP" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="jane@example.com" required />
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full btn-pay" id="pay-btn">
          💳 Pay Now
        </button>
      </form>

      <!-- ── TEST MODE HINT (remove in production) ── -->
      <div class="test-hint-box">
        <div class="test-hint-header">🧪 Test Mode — Demo Cards</div>
        <div class="test-hint-row">
          <span class="test-hint-label">✅ Success</span>
          <code>4111 1111 1111 1111</code>
        </div>
        <div class="test-hint-row">
          <span class="test-hint-label">❌ Failure</span>
          <code>4000 0000 0000 0002</code>
        </div>
        <div class="test-hint-note">Any future expiry date · Any CVV · Any name</div>
      </div>
    </section>

    <!-- RIGHT: Order Summary -->
    <aside class="order-summary-section">
      <h2 class="section-title">Order Summary</h2>

      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">🛒</div>
        <p>No items in cart.</p>
        <a href="index.html" class="btn-primary">Browse Products</a>
      </div>

      <div id="order-summary-content">
        <div class="order-items" id="order-items"></div>
        <div class="order-divider"></div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="order-subtotal">₹0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span class="tag-free">FREE</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="order-total">₹0.00</span>
        </div>
      </div>
    </aside>

  </main>

  <script src="audit.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
