<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Flight — ShopEasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

  <!-- ── HEADER (same as index.html) ──────────────────────── -->
  <header class="bg-[#1a1a2e] px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🛒</span>
      <a href="index.html" class="text-white font-bold text-xl tracking-tight">ShopEasy</a>
    </div>

    <nav class="hidden md:flex items-center gap-8">
      <a href="index.html" class="text-gray-300 hover:text-white transition-colors">Featured</a>
      <a href="cart.html"  class="text-gray-300 hover:text-white transition-colors">My Cart</a>
      <a href="audit-log.html" class="text-gray-300 hover:text-white transition-colors">Activity Log</a>
    </nav>

    <div class="flex items-center gap-3">
      <div id="cart-icon" onclick="toggleCart()"
           class="relative cursor-pointer text-gray-300 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 7h12M7 13H5.4M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
        <span id="cart-count"
              class="cart-count absolute -top-2 -right-2 bg-[#e14868] text-white text-[10px]
                     font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </div>
      <a href="flights.html"
         class="bg-[#e14868] text-white text-sm font-semibold px-4 py-2 rounded-lg underline underline-offset-2">
        Book Flight
      </a>
    </div>
  </header>

  <!-- Cart dropdown -->
  <div class="cart-dropdown" id="cart-dropdown">
    <h3>Your Cart</h3>
    <ul id="cart-items"></ul>
    <div class="cart-total" id="cart-total"></div>
    <p class="cart-empty" id="cart-empty">Your cart is empty.</p>
    <a href="cart.html" class="dropdown-view-cart" id="dropdown-view-cart">View Cart →</a>
  </div>

  <!-- ── MAIN ───────────────────────────────────────────────── -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-6 py-10">

    <!-- Page heading -->
    <h1 class="text-4xl font-extrabold text-[#1a1a2e] mb-8">Book a Flight</h1>

    <!-- Search form -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">

        <!-- From -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">From</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">➤</span>
            <input id="from-city" type="text" placeholder="City or Airport"
                   list="city-list"
                   class="w-full pl-8 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm
                          focus:outline-none focus:ring-2 focus:ring-[#e14868] focus:border-transparent"
                   onkeydown="if(event.key==='Enter') searchFlights()" />
          </div>
        </div>

        <!-- To -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">To</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">➤</span>
            <input id="to-city" type="text" placeholder="City or Airport"
                   list="city-list"
                   class="w-full pl-8 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm
                          focus:outline-none focus:ring-2 focus:ring-[#e14868] focus:border-transparent"
                   onkeydown="if(event.key==='Enter') searchFlights()" />
          </div>
        </div>

        <!-- Date -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Date</label>
          <input id="flight-date" type="date"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                        focus:outline-none focus:ring-2 focus:ring-[#e14868] focus:border-transparent" />
        </div>
      </div>

      <!-- Search button (full row on mobile, right-aligned on desktop) -->
      <div class="mt-4 flex justify-end">
        <button onclick="searchFlights()"
                class="bg-[#e14868] hover:bg-[#c73652] text-white font-semibold px-8 py-2.5
                       rounded-lg transition-colors duration-200 text-sm">
          Search Flights
        </button>
      </div>

      <!-- Datalist for city autocomplete -->
      <datalist id="city-list">
        <option value="Pune">
        <option value="Bangalore">
        <option value="Mumbai">
        <option value="Delhi">
        <option value="Goa">
        <option value="Chennai">
        <option value="Hyderabad">
      </datalist>
    </div>

    <!-- Results -->
    <div id="flight-results" class="flex flex-col gap-4"></div>

  </main>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="bg-gray-100 border-t border-gray-200 px-6 py-5 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="font-bold text-[#1a1a2e] text-lg">ShopEasy</span>
      <div class="flex flex-wrap items-center justify-center gap-5 text-sm text-gray-500">
        <a href="#" class="hover:text-[#e14868]">About Us</a>
        <a href="#" class="hover:text-[#e14868]">Contact</a>
        <a href="#" class="hover:text-[#e14868]">Privacy Policy</a>
        <a href="#" class="hover:text-[#e14868]">Terms of Service</a>
      </div>
      <span class="text-sm text-gray-400">© 2024 ShopEasy. All rights reserved.</span>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="audit.js"></script>
  <script src="app.js"></script>
  <script src="flights-data.js"></script>
  <script src="flights.js"></script>
</body>
</html>
